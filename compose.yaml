name: offball_v040
services:
  api:
    build: ./OFFBALL_API
    expose: ['8000']
    healthcheck:
      test: ['CMD', 'python', '-c', 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/health", timeout=3).close()']
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 20s
    environment:
      OFFBALL_DATABASE: /data/players.sqlite3
      OFFBALL_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    volumes:
      - offball_data:/data
  frontend:
    build: ./OFFBALL_FRONTEND
    ports: ['5173:80']
    environment:
      OFFBALL_API_UPSTREAM: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    restart: on-failure:3
volumes:
  offball_data:
